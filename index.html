<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Group Timer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #05060a;
      color: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .app {
      width: 100%;
      max-width: 420px;
      background: #111319;
      border-radius: 12px;
      padding: 20px 24px 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.75);
      border: 1px solid #232632;
    }

    .app h1 {
      font-size: 1.4rem;
      margin-bottom: 4px;
      text-align: center;
    }

    .app p.subtitle {
      font-size: 0.9rem;
      color: #b0b4c3;
      text-align: center;
      margin-bottom: 16px;
    }

    .row {
      display: flex;
      gap: 12px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .field {
      flex: 1 1 150px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    label {
      font-size: 0.85rem;
      color: #d0d3e0;
    }

    input[type="number"] {
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid #303446;
      background: #181b25;
      color: #f5f5f5;
      font-size: 0.95rem;
      outline: none;
    }

    input[type="number"]:focus {
      border-color: #4f9cff;
    }

    .status-box {
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 8px;
      background: #181b25;
      border: 1px solid #303446;
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-height: 58px;
    }

    .status-label {
      font-size: 0.8rem;
      color: #9094a3;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .status-value {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .status-running {
      color: #4fdf6a;
    }

    .status-stopped {
      color: #ff5c5c;
    }

    .status-ready {
      color: #f5f5f5;
    }

    .meta {
      font-size: 0.8rem;
      color: #a1a5b5;
      display: flex;
      justify-content: space-between;
      margin-top: 2px;
    }

    button {
      margin-top: 16px;
      width: 100%;
      padding: 10px 14px;
      border-radius: 10px;
      border: none;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      background: #4f9cff;
      color: #05060a;
      transition: background 0.15s ease, transform 0.05s ease;
    }

    button:hover {
      background: #6dabff;
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(0);
      background: #3d82db;
    }

    button[disabled] {
      cursor: not-allowed;
      opacity: 0.6;
      transform: none;
    }

    .btn-stop {
      background: #ff5c5c;
      color: #05060a;
    }

    .btn-stop:hover {
      background: #ff7777;
    }

    .error {
      margin-top: 8px;
      font-size: 0.8rem;
      color: #ff8080;
      min-height: 1em;
    }

    @media (max-width: 480px) {
      .app {
        padding: 18px 16px 20px;
      }
    }
  </style>
</head>



<body>
  <div class="app">
    <h1>Riptide Group Timer</h1>

    <div class="row">
      <div class="field">
        <label for="intervalSeconds">Interval (seconds)</label>
        <input id="intervalSeconds" type="number" min="1" step="1" value="30" />
      </div>
      <div class="field">
        <label for="repetitions">Repetitions (Start + Stop pairs)</label>
        <input id="repetitions" type="number" min="1" step="1" value="5" />
      </div>
    </div>

    <div class="status-box">
      <div class="status-label">Status</div>
      <div id="statusText" class="status-value status-ready">Ready</div>
      <div class="meta">
        <span id="cycleInfo">Reps completed: 0 / 0</span>
        <span id="phaseInfo">Phase: —</span>
      </div>
    </div>

    <button id="startBtn">Start Timer</button>
    <div id="errorMsg" class="error"></div>
  </div>

  <script>
    // -------- Audio setup --------
    const startSound = new Audio("audio/start.mp3");
    const stopSound = new Audio("audio/stop.mp3");

    startSound.volume = 1.0;
    stopSound.volume = 1.0;

    // Some mobile browsers block audio unless each element is "touched"
    // once inside a user gesture. This unlocks them.
    let audioUnlocked = false;

    function unlockAudio() {
      if (audioUnlocked) return;
      audioUnlocked = true;

      [startSound, stopSound].forEach(sound => {
        sound.play().then(() => {
          sound.pause();
          sound.currentTime = 0;
        }).catch(() => {
          // Ignore errors – this is just to unlock audio
        });
      });
    }

    function playStart() {
      startSound.currentTime = 0;
      startSound.play().catch(() => { });
    }

    function playStop() {
      stopSound.currentTime = 0;
      stopSound.play().catch(() => { });
    }


    // -------- DOM elements --------
    const intervalInput = document.getElementById("intervalSeconds");
    const repsInput = document.getElementById("repetitions");
    const startBtn = document.getElementById("startBtn");
    const statusText = document.getElementById("statusText");
    const cycleInfo = document.getElementById("cycleInfo");
    const phaseInfo = document.getElementById("phaseInfo");
    const errorMsg = document.getElementById("errorMsg");

    // -------- Timer state --------
    let timerId = null;
    let isStartPhase = true;      // true => play "Start", false => play "Stop"
    let completedReps = 0;
    let totalReps = 0;
    let intervalMs = 0;

    function setStatus(text, mode) {
      statusText.textContent = text;
      statusText.className = "status-value";
      if (mode === "running") statusText.classList.add("status-running");
      else if (mode === "stopped") statusText.classList.add("status-stopped");
      else statusText.classList.add("status-ready");
    }

    function updateMeta() {
      cycleInfo.textContent = `Reps completed: ${completedReps} / ${totalReps}`;
      const phaseLabel = timerId ? (isStartPhase ? "Start" : "Stop") : "—";
      phaseInfo.textContent = `Phase: ${phaseLabel}`;
    }

    function resetStateToReady() {
      clearInterval(timerId);
      timerId = null;
      isStartPhase = true;
      completedReps = 0;
      totalReps = 0;

      intervalInput.disabled = false;
      repsInput.disabled = false;
      startBtn.disabled = false;
      startBtn.textContent = "Start Timer";
      startBtn.classList.remove("btn-stop");

      setStatus("Ready", "ready");
      updateMeta();
    }

    function validateInputs() {
      errorMsg.textContent = "";

      const intervalVal = Number(intervalInput.value);
      const repsVal = Number(repsInput.value);

      if (!Number.isFinite(intervalVal) || intervalVal <= 0) {
        errorMsg.textContent = "Interval must be a positive number of seconds.";
        return null;
      }
      if (!Number.isFinite(repsVal) || repsVal <= 0) {
        errorMsg.textContent = "Repetitions must be a positive integer.";
        return null;
      }

      return {
        intervalMs: intervalVal * 1000,
        reps: Math.floor(repsVal)
      };
    }

    function tick() {
      if (isStartPhase) {
        // Start phase
        playStart();
        setStatus("Running – START", "running");
      } else {
        // Stop phase
        playStop();
        setStatus("Running – STOP", "running");

        completedReps += 1;
        if (completedReps >= totalReps) {
          // Finished all repetitions
          clearInterval(timerId);
          timerId = null;
          setStatus("Finished", "stopped");
          intervalInput.disabled = false;
          repsInput.disabled = false;
          startBtn.disabled = false;
          startBtn.textContent = "Start Timer";
          startBtn.classList.remove("btn-stop");
        }
      }

      isStartPhase = !isStartPhase;
      updateMeta();
    }

    function startTimer() {
      const validated = validateInputs();
      if (!validated) return;

      intervalMs = validated.intervalMs;
      totalReps = validated.reps;
      completedReps = 0;
      isStartPhase = true;
      updateMeta();

      intervalInput.disabled = true;
      repsInput.disabled = true;
      startBtn.textContent = "Stop Early";
      startBtn.classList.add("btn-stop");
      setStatus("Running – START", "running");

      // First tick immediately (plays "Start")
      tick();

      // Then alternate every interval
      timerId = setInterval(tick, intervalMs);
    }

    function stopEarly() {
      clearInterval(timerId);
      timerId = null;
      setStatus("Stopped early", "stopped");
      intervalInput.disabled = false;
      repsInput.disabled = false;
      startBtn.textContent = "Start Timer";
      startBtn.classList.remove("btn-stop");
      updateMeta();
    }

    startBtn.addEventListener("click", () => {
      // First tap: unlock both audio elements for mobile browsers
      unlockAudio();

      if (timerId === null) {
        startTimer();
      } else {
        stopEarly();
      }
    });

    // Initialize display
    resetStateToReady();
  </script>
</body>

</html>
